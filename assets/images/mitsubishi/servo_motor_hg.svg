<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="100%" height="100%">
  <defs>
    <linearGradient id="motor_body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="shaft_grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
  </defs>
  <!-- Output Shaft on left -->
  <rect x="40" y="125" width="60" height="30" rx="2" fill="url(#shaft_grad)" stroke="#334155"/>
  <!-- Keyway on shaft -->
  <rect x="55" y="127" width="30" height="6" rx="1" fill="#475569"/>

  <!-- Front Mounting Flange -->
  <rect x="100" y="70" width="25" height="140" rx="4" fill="#475569" stroke="#1e293b"/>
  <!-- Mounting bolt holes -->
  <circle cx="112" cy="85" r="4" fill="#0f172a" stroke="#cbd5e1"/>
  <circle cx="112" cy="195" r="4" fill="#0f172a" stroke="#cbd5e1"/>

  <!-- Motor Housing Cylinder with cooling grooves -->
  <rect x="125" y="80" width="180" height="120" rx="6" fill="url(#motor_body)" stroke="#475569" stroke-width="2"/>
  <line x1="145" y1="80" x2="145" y2="200" stroke="#1e2430" stroke-width="2"/>
  <line x1="170" y1="80" x2="170" y2="200" stroke="#1e2430" stroke-width="2"/>
  <line x1="195" y1="80" x2="195" y2="200" stroke="#1e2430" stroke-width="2"/>
  <line x1="220" y1="80" x2="220" y2="200" stroke="#1e2430" stroke-width="2"/>
  <line x1="245" y1="80" x2="245" y2="200" stroke="#1e2430" stroke-width="2"/>
  <line x1="270" y1="80" x2="270" y2="200" stroke="#1e2430" stroke-width="2"/>

  <!-- Rear Encoder Cap with Mitsubishi Logo -->
  <rect x="305" y="85" width="45" height="110" rx="4" fill="#0f172a" stroke="#334155"/>
  <rect x="310" y="95" width="35" height="4" fill="#e60012"/>

  <!-- Cable Leads / Military-style Connectors (Power & Encoder) -->
  <rect x="250" y="45" width="22" height="35" rx="3" fill="#1e293b" stroke="#64748b"/>
  <path d="M 261 45 C 261 25, 290 25, 320 20" fill="none" stroke="#f59e0b" stroke-width="4"/>

  <rect x="285" y="45" width="22" height="35" rx="3" fill="#1e293b" stroke="#64748b"/>
  <path d="M 296 45 C 296 30, 320 30, 350 25" fill="none" stroke="#3b82f6" stroke-width="4"/>

  <!-- Model Specification Label -->
  <rect x="140" y="115" width="130" height="50" rx="4" fill="#0b0f19" stroke="#334155"/>
  <text x="148" y="132" fill="#ffffff" font-size="10" font-weight="bold" font-family="Arial, sans-serif">MITSUBISHI AC SERVO</text>
  <text x="148" y="147" fill="#38bdf8" font-size="12" font-weight="bold" font-family="monospace">HG-KR43 (400W)</text>
  <text x="148" y="159" fill="#94a3b8" font-size="8" font-family="sans-serif">3000 r/min • 22-bit Encoder</text>
</svg>