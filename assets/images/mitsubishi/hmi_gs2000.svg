<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bezel_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="lcd_screen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
  </defs>
  <!-- Outer Bezel -->
  <rect x="20" y="15" width="360" height="250" rx="10" fill="url(#bezel_grad)" stroke="#475569" stroke-width="2"/>
  
  <!-- Mitsubishi Logo on top bezel -->
  <text x="40" y="36" fill="#f8fafc" font-size="11" font-weight="bold" font-family="Arial, sans-serif" letter-spacing="1">MITSUBISHI</text>
  <text x="310" y="36" fill="#38bdf8" font-size="11" font-weight="900" font-family="Arial, sans-serif">GOT Simple</text>

  <!-- Inner LCD Display Area (7 inch 16:9) -->
  <rect x="38" y="46" width="324" height="195" rx="4" fill="url(#lcd_screen)" stroke="#1e2430" stroke-width="2"/>
  
  <!-- Screen UI Mockup -->
  <!-- Top Status Bar -->
  <rect x="38" y="46" width="324" height="24" fill="#0f172a"/>
  <text x="48" y="62" fill="#38bdf8" font-size="10" font-weight="bold" font-family="sans-serif">LINE 1: PRODUCTION OVERVIEW</text>
  <text x="315" y="62" fill="#22c55e" font-size="10" font-family="sans-serif">ONLINE</text>

  <!-- Dashboard Gauges / Content -->
  <rect x="52" y="80" width="90" height="65" rx="4" fill="#1e293b" stroke="#334155"/>
  <text x="60" y="96" fill="#94a3b8" font-size="8" font-family="sans-serif">OUTPUT RATE</text>
  <text x="60" y="125" fill="#38bdf8" font-size="20" font-weight="bold" font-family="sans-serif">1,450</text>
  <text x="118" y="125" fill="#64748b" font-size="9" font-family="sans-serif">pcs/h</text>

  <rect x="152" y="80" width="90" height="65" rx="4" fill="#1e293b" stroke="#334155"/>
  <text x="160" y="96" fill="#94a3b8" font-size="8" font-family="sans-serif">LINE SPEED</text>
  <text x="160" y="125" fill="#22c55e" font-size="20" font-weight="bold" font-family="sans-serif">45.8</text>
  <text x="212" y="125" fill="#64748b" font-size="9" font-family="sans-serif">m/min</text>

  <!-- Interactive buttons on screen -->
  <rect x="252" y="80" width="95" height="30" rx="4" fill="#166534" stroke="#22c55e"/>
  <text x="278" y="100" fill="#f0fdf4" font-size="11" font-weight="bold" font-family="sans-serif">▶ START</text>

  <rect x="252" y="115" width="95" height="30" rx="4" fill="#991b1b" stroke="#ef4444"/>
  <text x="280" y="135" fill="#fef2f2" font-size="11" font-weight="bold" font-family="sans-serif">⏹ STOP</text>

  <!-- Trend graph mockup -->
  <rect x="52" y="155" width="295" height="72" rx="4" fill="#0a0f1d" stroke="#1e293b"/>
  <polyline points="60,205 90,195 130,210 170,185 210,190 250,170 290,175 335,165" fill="none" stroke="#06b6d4" stroke-width="2.5"/>
  <text x="60" y="170" fill="#64748b" font-size="8" font-family="sans-serif">REALTIME EFFICIENCY TREND</text>

  <!-- Model Badge at Bottom -->
  <text x="42" y="255" fill="#94a3b8" font-size="9" font-weight="bold" font-family="monospace">GS2107-WTBD-N (7" WVGA)</text>
  <circle cx="355" cy="252" r="3" fill="#22c55e"/>
  <text x="330" y="255" fill="#64748b" font-size="8" font-family="sans-serif">PWR</text>
</svg>