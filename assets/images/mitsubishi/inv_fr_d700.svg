<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="100%" height="100%">
  <rect x="80" y="15" width="240" height="250" rx="8" fill="#1f2937" stroke="#4b5563" stroke-width="2"/>
  <rect x="80" y="15" width="240" height="6" rx="2" fill="#e60012"/>
  <text x="95" y="40" fill="#f9fafb" font-size="12" font-weight="bold">MITSUBISHI FREQROL-D700</text>
  <!-- Display -->
  <rect x="95" y="55" width="210" height="85" rx="6" fill="#0f172a" stroke="#374151"/>
  <rect x="105" y="65" width="100" height="32" rx="3" fill="#020617"/>
  <text x="115" y="90" fill="#ef4444" font-size="20" font-weight="bold" font-family="monospace">0.00</text>
  <text x="175" y="80" fill="#22c55e" font-size="8">Hz</text>
  <!-- Dial -->
  <circle cx="260" cy="82" r="20" fill="#374151" stroke="#9ca3af"/>
  <line x1="260" y1="65" x2="260" y2="73" stroke="#fff" stroke-width="2"/>
  <!-- Buttons -->
  <rect x="105" y="105" width="40" height="22" rx="3" fill="#374151"/><text x="112" y="120" fill="#d1d5db" font-size="8">MODE</text>
  <rect x="150" y="105" width="40" height="22" rx="3" fill="#374151"/><text x="160" y="120" fill="#d1d5db" font-size="8">SET</text>
  <rect x="195" y="105" width="45" height="22" rx="3" fill="#15803d"/><text x="207" y="120" fill="#fff" font-size="8">RUN</text>
  <rect x="245" y="105" width="45" height="22" rx="3" fill="#b91c1c"/><text x="254" y="120" fill="#fff" font-size="8">STOP</text>
  <!-- Terminals -->
  <rect x="95" y="155" width="210" height="95" rx="4" fill="#111827" stroke="#374151"/>
  <text x="105" y="175" fill="#f59e0b" font-size="9" font-weight="bold">R/L1  S/L2  T/L3 | U  V  W</text>
  <text x="120" y="210" fill="#38bdf8" font-size="11" font-weight="bold" font-family="monospace">FR-D740-2.2K-CHT</text>
  <text x="110" y="235" fill="#9ca3af" font-size="9">3-Phase 380-480V 50/60Hz</text>
</svg>