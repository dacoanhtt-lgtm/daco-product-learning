<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="100%" height="100%">
  <defs>
    <linearGradient id="mccb_body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d3748"/>
      <stop offset="100%" stop-color="#1a202c"/>
    </linearGradient>
  </defs>
  <!-- MCCB Case -->
  <rect x="80" y="15" width="240" height="250" rx="8" fill="url(#mccb_body)" stroke="#4a5568" stroke-width="2"/>
  
  <!-- Line Side Terminals (Top 3P) -->
  <rect x="100" y="15" width="35" height="35" rx="3" fill="#0f172a" stroke="#475569"/>
  <circle cx="117" cy="32" r="6" fill="#e2e8f0" stroke="#64748b"/>
  <text x="113" y="12" fill="#94a3b8" font-size="8" font-family="sans-serif">1/L1</text>

  <rect x="182" y="15" width="35" height="35" rx="3" fill="#0f172a" stroke="#475569"/>
  <circle cx="200" cy="32" r="6" fill="#e2e8f0" stroke="#64748b"/>
  <text x="195" y="12" fill="#94a3b8" font-size="8" font-family="sans-serif">3/L2</text>

  <rect x="265" y="15" width="35" height="35" rx="3" fill="#0f172a" stroke="#475569"/>
  <circle cx="282" cy="32" r="6" fill="#e2e8f0" stroke="#64748b"/>
  <text x="278" y="12" fill="#94a3b8" font-size="8" font-family="sans-serif">5/L3</text>

  <!-- Central Handle Well -->
  <rect x="150" y="80" width="100" height="110" rx="6" fill="#0f172a" stroke="#334155"/>
  
  <!-- Operating Toggle Handle (ON / OFF) -->
  <rect x="185" y="95" width="30" height="50" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="187" y="97" width="26" height="16" fill="#dc2626"/>
  <text x="192" y="109" fill="#ffffff" font-size="9" font-weight="bold" font-family="sans-serif">ON</text>
  <text x="190" y="138" fill="#475569" font-size="8" font-weight="bold" font-family="sans-serif">OFF</text>

  <!-- Push to Trip button -->
  <circle cx="165" cy="165" r="7" fill="#ef4444" stroke="#7f1d1d"/>
  <text x="157" y="180" fill="#94a3b8" font-size="7" font-family="sans-serif">TRIP</text>

  <!-- Specification Nameplate -->
  <rect x="95" y="70" width="48" height="120" rx="3" fill="#1e293b" stroke="#334155"/>
  <text x="100" y="88" fill="#ffffff" font-size="9" font-weight="bold" font-family="sans-serif">MITSUBISHI</text>
  <text x="100" y="105" fill="#e60012" font-size="11" font-weight="bold" font-family="monospace">NF125-CV</text>
  <text x="100" y="122" fill="#38bdf8" font-size="10" font-weight="bold" font-family="monospace">3P 100A</text>
  <text x="100" y="140" fill="#94a3b8" font-size="7" font-family="sans-serif">50/60Hz</text>
  <text x="100" y="155" fill="#22c55e" font-size="8" font-weight="bold" font-family="sans-serif">Icu: 30kA</text>

  <!-- Load Side Terminals (Bottom 3P) -->
  <rect x="100" y="225" width="35" height="35" rx="3" fill="#0f172a" stroke="#475569"/>
  <circle cx="117" cy="242" r="6" fill="#e2e8f0" stroke="#64748b"/>
  <text x="113" y="272" fill="#94a3b8" font-size="8" font-family="sans-serif">2/T1</text>

  <rect x="182" y="225" width="35" height="35" rx="3" fill="#0f172a" stroke="#475569"/>
  <circle cx="200" cy="242" r="6" fill="#e2e8f0" stroke="#64748b"/>
  <text x="195" y="272" fill="#94a3b8" font-size="8" font-family="sans-serif">4/T2</text>

  <rect x="265" y="225" width="35" height="35" rx="3" fill="#0f172a" stroke="#475569"/>
  <circle cx="282" cy="242" r="6" fill="#e2e8f0" stroke="#64748b"/>
  <text x="278" y="272" fill="#94a3b8" font-size="8" font-family="sans-serif">6/T3</text>
</svg>