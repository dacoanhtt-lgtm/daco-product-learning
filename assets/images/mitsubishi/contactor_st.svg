<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="100%" height="100%">
  <!-- Contactor Body -->
  <rect x="70" y="15" width="260" height="140" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  <!-- Red accent -->
  <rect x="70" y="15" width="260" height="6" fill="#e60012"/>
  <!-- Terminals L1 L2 L3 -->
  <circle cx="110" cy="35" r="6" fill="#64748b" stroke="#cbd5e1"/>
  <circle cx="180" cy="35" r="6" fill="#64748b" stroke="#cbd5e1"/>
  <circle cx="250" cy="35" r="6" fill="#64748b" stroke="#cbd5e1"/>
  <text x="100" y="25" fill="#94a3b8" font-size="8">1/L1</text>
  <text x="170" y="25" fill="#94a3b8" font-size="8">3/L2</text>
  <text x="240" y="25" fill="#94a3b8" font-size="8">5/L3</text>
  <!-- Contactor Center Display -->
  <rect x="130" y="60" width="140" height="70" rx="4" fill="#0f172a" stroke="#334155"/>
  <text x="145" y="82" fill="#ffffff" font-size="11" font-weight="bold">MITSUBISHI</text>
  <text x="145" y="100" fill="#f59e0b" font-size="14" font-weight="900" font-family="monospace">S-T21</text>
  <text x="145" y="118" fill="#38bdf8" font-size="9">Coil: 220-240VAC</text>
  <!-- Indicator Button -->
  <rect x="95" y="75" width="22" height="35" rx="3" fill="#ea580c"/>
  <!-- Thermal Overload Relay Attached Below -->
  <rect x="70" y="160" width="260" height="105" rx="6" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <text x="85" y="180" fill="#f8fafc" font-size="10" font-weight="bold">THERMAL RELAY TH-T25</text>
  <!-- Dial adjust -->
  <circle cx="120" cy="210" r="16" fill="#334155" stroke="#f59e0b" stroke-width="2"/>
  <text x="110" y="214" fill="#f59e0b" font-size="8" font-weight="bold">15-20A</text>
  <!-- Reset button -->
  <rect x="160" y="200" width="30" height="20" rx="3" fill="#3b82f6"/>
  <text x="165" y="214" fill="#fff" font-size="8" font-weight="bold">RESET</text>
  <!-- Stop button -->
  <rect x="200" y="200" width="30" height="20" rx="3" fill="#ef4444"/>
  <text x="206" y="214" fill="#fff" font-size="8" font-weight="bold">STOP</text>
  <text x="85" y="250" fill="#94a3b8" font-size="9">T1(2)  T2(4)  T3(6) ➔ To Motor</text>
</svg>